name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
      - run: go vet ./internal/...
      - run: go test ./internal/...

  build:
    name: Build ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each target builds on its own native runner, so bindings generation
          # works and no -skipbindings workaround is needed.
          - name: linux
            os: ubuntu-latest
            platform: linux/amd64
            tags: webkit2_41
          - name: windows
            os: windows-latest
            platform: windows/amd64
            tags: ''
          - name: mac
            os: macos-latest
            platform: darwin/universal
            tags: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux GUI deps
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      - name: Install Wails CLI
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.1; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            echo "Wails CLI install failed; retrying in $((attempt * 5)) seconds..."
            sleep $((attempt * 5))
          done

      - name: Build
        run: wails build -platform ${{ matrix.platform }} -tags "${{ matrix.tags }}"

      - uses: actions/upload-artifact@v4
        with:
          name: mellowtel-consumer-${{ matrix.name }}
          path: build/bin/*
